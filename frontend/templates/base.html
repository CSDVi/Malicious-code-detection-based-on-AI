<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}獬豸安码{% endblock %}</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}?v=1.11.3" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}?v=20260731-card-transitions" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="app-shell">
    <main class="main-content motion-page">
        <div class="content-frame">
            {% if current_user.is_authenticated %}
            <nav class="module-cards" aria-label="主导航">
                <span class="module-nav-balance" aria-hidden="true"></span>
                <div class="module-links">
                    <a class="module-card {% if request.path == '/' %}active{% endif %}" href="{{ url_for('main.dashboard') }}">
                        <span>系统总览</span>
                    </a>
                    <a class="module-card {% if request.path in ['/attack/', '/attack/project'] %}active{% endif %}" href="{{ url_for('attack.index') }}">
                        <i class="bi bi-search"></i><span>检测中心</span>
                    </a>
                    <a class="module-card {% if request.path.startswith('/attack/history') or request.path.startswith('/attack/record') %}active{% endif %}" href="{{ url_for('attack.history') }}">
                        <span>历史记录</span>
                    </a>
                    <a class="module-card {% if request.path.startswith('/attack/models') or request.path.startswith('/attack/evaluation') %}active{% endif %}" href="{{ url_for('attack.models') }}">
                        <span>模型中心</span>
                    </a>
                </div>
                <div class="topbar-actions">
                    <span class="user-pill">{{ current_user.username }}</span>
                    <a class="ghost-action" href="{{ url_for('main.logout') }}">退出</a>
                </div>
            </nav>
            <section id="scan-job-tray" class="scan-job-tray" data-jobs-url="{{ url_for('attack.job_list') }}" data-project-url="{{ url_for('attack.project_scan') }}" hidden>
                <div class="scan-job-tray-list" data-job-list></div>
            </section>
            {% endif %}

            <div class="page-transition-stage" data-page-transition-stage>
                {% with messages = get_flashed_messages() %}
                {% for msg in messages %}<div class="flash-error motion-card">{{ msg }}</div>{% endfor %}
                {% endwith %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
</div>

<script>
const LAUNCHER_TOKEN_KEY = "xiezhi_launcher_page_token";
function getLauncherToken() {
    let token = sessionStorage.getItem(LAUNCHER_TOKEN_KEY);
    if (!token) {
        token = window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random();
        sessionStorage.setItem(LAUNCHER_TOKEN_KEY, token);
    }
    return token;
}
function postLauncher(url) {
    return fetch(url, {
        method: "POST",
        keepalive: true,
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({token: getLauncherToken()})
    }).catch(function(){});
}

let launcherCloseSent = false;
function notifyLauncherPageClosed() {
    if (launcherCloseSent) {
        return;
    }
    const token = sessionStorage.getItem(LAUNCHER_TOKEN_KEY);
    if (!token) {
        return;
    }
    launcherCloseSent = true;
    const url = "/api/launcher/session/close";
    const payload = JSON.stringify({token: token});
    if (navigator.sendBeacon) {
        const body = new Blob([payload], {type: "application/json"});
        if (navigator.sendBeacon(url, body)) {
            return;
        }
    }
    fetch(url, {
        method: "POST",
        keepalive: true,
        headers: {"Content-Type": "application/json"},
        body: payload
    }).catch(function(){});
}

postLauncher("/api/launcher/session/open");
setInterval(function(){ postLauncher("/api/launcher/heartbeat"); }, 2000);
window.addEventListener("pagehide", function(event) {
    if (!event.persisted) {
        notifyLauncherPageClosed();
    }
});
window.addEventListener("pageshow", function(event) {
    if (event.persisted) {
        launcherCloseSent = false;
        postLauncher("/api/launcher/session/open");
    }
});
window.addEventListener("focus", function() {
    launcherCloseSent = false;
    postLauncher("/api/launcher/heartbeat");
});
document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
        launcherCloseSent = false;
        postLauncher("/api/launcher/heartbeat");
    }
});
</script>
<script src="{{ url_for('static', filename='js/app.js') }}?v=20260731-card-transitions"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
