{% extends "base.html" %}
{% block title %}登录 - 獬豸安码{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="auth-card motion-card">
        <h1>登录獬豸安码</h1>
        <form method="post">
            <div class="field"><label>用户名</label><input name="username" placeholder="用户名" value="admin" autocomplete="username"></div>
            <div class="field"><label>密码</label><input name="password" type="password" placeholder="密码" value="admin123" autocomplete="current-password"></div>
            <button class="primary-action" type="submit" style="width:100%">登录</button>
        </form>
        <p class="metric-sub" style="margin-top:16px"><a href="{{ url_for('main.register') }}">注册新账号</a></p>
    </div>
</section>
{% endblock %}
